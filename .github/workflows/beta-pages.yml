name: Media Minder Beta

on:
  push:
    branches: ["qa/cal-02-onboarding-lab"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-pages
  cancel-in-progress: true

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full regression before deployment
        run: npm test

  deploy:
    needs: regression-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Publish beta preview to /beta
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: beta
          keep_files: true
