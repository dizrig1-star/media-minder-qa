name: Media Minder Regression

on:
  push:
    branches: [main, "qa/**"]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
