<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Media Minder</title>
<style>
:root{
  --bg:#f8f4ea;
  --surface:#ffffff;
  --text:#2f2f2f;
  --teal:#4f9ea6;
  --coral:#e57b6f;
  --cream:#f8f4ea;
  --gold:#d8b247;
  --silver:#b8bcc3;
  --bronze:#a86c3d;
  --radius:16px;
  --space:8px;
}

body{font-family:system-ui,sans-serif;}
h1,h2,h3{margin:.5rem 0;}

.card{border:1px solid #ddd;border-radius:var(--radius);padding:16px;background:var(--surface);margin-bottom:16px;}
.btn{padding:.6rem 1rem;border-radius:var(--radius);border:1px solid #bbb;background:#fafafa;cursor:pointer;}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;}
.hero{min-height:280px;}
nav.mm-nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--surface);border-bottom:1px solid #ddd;}
nav.mm-nav button{padding:.5rem .9rem;border-radius:12px;border:1px solid #bbb;background:#fafafa;cursor:pointer;}
nav.mm-nav button.active{background:var(--teal);color:#fff;}
header.mm-header,footer.mm-footer{background:var(--teal);color:#fff;padding:16px;}
main{padding:24px;}

/* v1.0.0-rc.2: styling for elements introduced by the Watchlist/Settings/Modal merge. */
.platform-chip{display:inline-flex;border:1px solid #ddd;border-radius:999px;padding:4px 10px;margin:2px 4px 2px 0;font-size:.8rem;background:#f7f1e3;}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:.75rem;}
.stack > .card{margin-bottom:16px;}

/* v1.0.0-rc.5: mobile breakpoint. Landing's two-column grid was fixed at
   2fr/1fr with no @media rule anywhere in the codebase -- on a real phone
   viewport the sidebar column would be squeezed to a sliver. Collapses to
   a single stacked column below 720px. */
@media (max-width: 720px) {
  .grid { grid-template-columns: 1fr; }
}

/* v1.0.0-rc.6: fixed a real bug found while adding Rating -- component-scoped
   CSS files (Modal.css, PlatformChip.css) were never actually loaded. Only
   styles/app.css's four @imports (design-tokens/typography/components/brand)
   are linked from index.html; nothing imported the individual component
   .css files. PlatformChip's own rule happened to be harmlessly shadowed by
   a duplicate already added here in rc.2, but Modal's rules (sizing,
   backdrop, close-button position) were never applied at all -- the live
   site has been shipping an unstyled native <dialog> since rc.2. Moving the
   real rules here, where they're actually loaded, instead of leaving them
   in files nothing imports. */
.mm-modal{border-radius:var(--radius);border:1px solid #ddd;padding:1.25rem;max-width:480px;width:90%;}
.mm-modal::backdrop{background:rgba(0,0,0,.4);}
.mm-modal-close{position:absolute;top:.5rem;right:.5rem;padding:.25rem .6rem;line-height:1;}
.rating{display:flex;gap:2px;margin-top:.5rem;}
.star-btn{background:none;border:none;font-size:1.15rem;line-height:1;cursor:pointer;padding:2px;color:var(--gold);}

/* v1.0.0-rc.7: replaced the text/color-pill placeholders with real MM Select
   badge artwork and the MM logo (cropped from Simon's reference concept art,
   src/assets/branding/). The old .mm-badge/.mm-gold/.mm-silver/.mm-bronze
   pill rules are gone -- Badge.js no longer emits that markup, so those rules
   would otherwise become dead code the way Modal.css/PlatformChip.css did in
   rc.6. They also carried three of the four color-contrast violations from
   the 2026-08-08 axe-core audit; using image badges with real alt text
   sidesteps that specific failure class (still worth a real accessibility
   pass on the final artwork once it's finalized, not just this placeholder).
   Sizes below were chosen by actually rendering the source art at several
   heights (28/36/40/48px for badges, 40/56/64px for the header logo) -- the
   original attempt (40px header, 28px badges) made the wordmark and the
   SELECT/tier text illegible, not just "compact." These sizes are the
   smallest that keep the artwork's own text readable. */
.mm-logo{height:64px;width:auto;display:block;}
.mm-badge-img{height:40px;width:auto;display:inline-block;vertical-align:middle;margin-bottom:.4rem;}
.hero .mm-badge-img{height:56px;margin-bottom:.6rem;}
.editorial-note{font-style:italic;border-left:4px solid var(--teal);padding-left:12px;}
.future-feature{border:2px dashed var(--coral);border-radius:var(--radius);padding:1rem;}

</style>
</head>
<body>
<div id='header-slot'></div>
<div id='nav-slot'></div>
<main id='view'></main>
<div id='footer-slot'></div>

// ---- state/store.js ----
const M_state_store_js = (function() {
// Single application state manager -- the one source of truth for runtime state.
// No component or service should keep its own copy of this data.

const listeners = new Set();

// v1.0.0-rc.5: the watchlist survives a page refresh.
// v1.0.0-rc.6: ratings do too, on the same pattern -- a separate storage
// key so clearing one doesn't clear the other. Both guarded so they never
// throw in a context without a real browser (Node scripts, jsdom setups
// that don't wire up localStorage, private-browsing quota errors).
const WATCHLIST_KEY = 'media-minder-watchlist-v1';
const RATINGS_KEY = 'media-minder-ratings-v1';

function loadPersisted(key, fallback, isValid) {
  try {
    if (typeof window === 'undefined' || !window.localStorage) return fallback;
    const raw = window.localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return isValid(parsed) ? parsed : fallback;
  } catch {
    return fallback;
  }
}

function persist(key, value) {
  try {
    if (typeof window === 'undefined' || !window.localStorage) return;
    window.localStorage.setItem(key, JSON.stringify(value));
  } catch {
    // Storage can fail (private browsing, quota, disabled). Still works
    // for the rest of the session -- just won't survive a reload. Not
    // fatal, so we don't throw.
  }
}

function loadPersistedWatchlist() {
  return loadPersisted(WATCHLIST_KEY, [], Array.isArray);
}

function loadPersistedRatings() {
  return loadPersisted(RATINGS_KEY, {}, v => v && typeof v === 'object' && !Array.isArray(v));
}

let state = Object.freeze({
  page: 'landing',
  shows: [],
  movies: [],
  profile: null,
  franchises: [],
  landingModel: { hero: null, silver: [] },
  watchlist: loadPersistedWatchlist(),
  ratings: loadPersistedRatings()
});

function getState() {
  return state;
}

function setState(patch) {
  state = Object.freeze({ ...state, ...patch });
  listeners.forEach(fn => fn(state));
  return state;
}

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

// Toggles a single item on/off the watchlist by id, and persists the result.
// Lives here, not in a component, so the watchlist stays governed by the
// one state manager.
function toggleWatchlist(id) {
  const { watchlist } = state;
  const next = watchlist.includes(id)
    ? watchlist.filter(x => x !== id)
    : [...watchlist, id];
  persist(WATCHLIST_KEY, next);
  return setState({ watchlist: next });
}

// Sets (or clears, if the same rating is clicked again) a 1-5 star rating
// for an item, and persists it. A second click on the same star toggles
// the rating off, so rating something isn't a one-way door.
function rateItem(id, rating) {
  const current = state.ratings[id];
  const next = { ...state.ratings };
  if (current === rating) {
    delete next[id];
  } else {
    next[id] = rating;
  }
  persist(RATINGS_KEY, next);
  return setState({ ratings: next });
}

return { getState, setState, subscribe, toggleWatchlist, rateItem };
})();
const { getState, setState, subscribe, toggleWatchlist, rateItem } = M_state_store_js;

const M_components_Rating_Rating_js = (function() {
// v1.0.0-rc.6: five clickable stars for the new personal-rating feature
// (backs the My Reviews screen). A second click on an already-set star
// clears the rating -- see state/store.js `rateItem`.
function Rating(itemId, currentRating = 0) {
  let stars = '';
  for (let i = 1; i <= 5; i++) {
    const filled = i <= currentRating;
    stars += `<button type='button' class='star-btn' data-rate-id='${itemId}' data-rating='${i}' aria-label='Rate ${i} star${i > 1 ? 's' : ''}' aria-pressed='${filled}'>${filled ? '&#9733;' : '&#9734;'}</button>`;
  }
  return `<div class='rating' role='group' aria-label='Your rating'>${stars}</div>`;
}

return { Rating };
})();

const M_components_Modal_Modal_js = (function() {

// ---- services/mmSelectEngine.js ----
const M_services_mmSelectEngine_js = (function() {
// Canonical MM Select / recommendation engine.
//
// v1.0.0-rc.4 (2026-08-13): rebuilt as a real staged funnel, replacing the
// flat weighted-scoring model from rc.2. The rc.2 model computed every
// factor in parallel and added up points -- nothing was ever actually
// EXCLUDED for failing a stage (platform availability in particular was
// a soft bonus, not a filter). Simon asked directly whether the engine
// achieved this staged pipeline; the honest answer was no, so this
// version implements it literally, stage by stage:
//
//   AVAILABLE CONTENT
//     -> EDITORIAL QUALITY FILTER
//     -> TIMELINESS / EVENT FILTER
//     -> USER PROFILE MATCH
//     -> FRANCHISE / CAST / GENRE CONNECTION   (ranks, doesn't remove)
//     -> PLATFORM AVAILABILITY FILTER
//     -> MM SELECT RATING FILTER               (Gold only)
//     -> ONE GREAT RECOMMENDATION
//
// Each filter stage narrows the candidate pool; nothing that fails a
// stage can be recovered by scoring well on a later one. runFunnel()
// chains them and records a trace of survivor counts, so "why did this
// come back empty" has a real, inspectable answer.

const CONNECTION_WEIGHTS = { genre: 5, franchise: 4, person: 2 };
const MM_LEVELS = ['Gold', 'Silver', 'Bronze'];

function overlaps(a = [], b = []) {
  return a.some(x => b.includes(x));
}

// Stage 1: the funnel's entry point. No filtering -- just names where the
// trace starts, before any stage has had a chance to remove anything.
function availableContent(items) {
  return [...items];
}

// Stage 2: editorial quality. An item counts as editorially vetted if it
// carries an MM Select tier (already required by the enforced Show/Movie
// models) AND has real editorial "why" copy written for it -- a checkable
// signal that an editor actually looked at this, not just bare metadata
// that happens to have a rating on it.
function editorialQualityFilter(items) {
  return items.filter(i => MM_LEVELS.includes(i.mmSelect) && typeof i.why === 'string' && i.why.trim().length > 0);
}

// Stage 3: timeliness. Evergreen catalog items (no premiere/event date)
// always pass -- timeliness doesn't apply to them. Items with a premiere
// date pass if it's today or in the future, or if the item is an actively
// "returning" series (still current regardless of its last air date).
// Only a one-off item whose premiere already happened, and that isn't
// part of an ongoing run, gets cut here.
function timelinessFilter(items, now) {
  const cutoff = now || new Date();
  return items.filter(item => {
    if (!item.premiere) return true;
    if (item.status === 'returning') return true;
    return new Date(item.premiere) >= cutoff;
  });
}

// Stage 4: user profile match. A broad relevance gate -- does this item
// touch the profile on ANY taste signal (genre, platform, franchise, or a
// favorite cast member). Deliberately permissive (OR across all four) so
// it doesn't collapse the pool to nothing; stage 5 does the fine-grained
// ranking among whatever survives.
function userProfileMatch(items, profile) {
  return items.filter(item =>
    overlaps(item.genre, profile.preferredGenres) ||
    profile.preferredPlatforms.includes(item.platform) ||
    overlaps(item.franchises, profile.franchises) ||
    overlaps(item.cast, profile.favoritePeople)
  );
}

// Stage 5: franchise/cast/genre connection. NOT a filter -- ranks the
// survivors by how strong their tie to the profile is, so the strongest
// match leads once weaker candidates get cut by the stages that follow.
function connectionScore(item, profile) {
  let score = 0;
  if (overlaps(item.genre, profile.preferredGenres)) score += CONNECTION_WEIGHTS.genre;
  if (overlaps(item.franchises, profile.franchises)) score += CONNECTION_WEIGHTS.franchise;
  if (overlaps(item.cast, profile.favoritePeople)) score += CONNECTION_WEIGHTS.person;
  return score;
}
function franchiseCastGenreConnection(items, profile) {
  return [...items]
    .map(item => ({ ...item, connectionScore: connectionScore(item, profile) }))
    .sort((a, b) => b.connectionScore - a.connectionScore);
}

// Stage 6: platform availability. A real filter now, not a soft bonus --
// content on a platform the profile doesn't have is dropped outright, not
// just scored two points lower.
function platformAvailabilityFilter(items, profile) {
  return items.filter(item => profile.preferredPlatforms.includes(item.platform));
}

// Stage 7: MM Select rating. Gold only -- this is the funnel's final cut,
// and it's what makes the output "MM Select Gold" rather than just "top
// pick." Matches the "never fabricate a Gold pick" rule that's applied
// everywhere else in this codebase: if nothing survives every prior stage
// AND carries a real Gold rating, this stage (and the funnel) comes back
// empty, on purpose.
function mmSelectRatingFilter(items) {
  return items.filter(i => i.mmSelect === 'Gold');
}

// Runs the full funnel. Returns:
//   rankedAvailable -- survivors of stages 1-6 (editorially real, timely,
//                      profile-relevant, available on the user's
//                      platforms), ranked by connection strength. Used for
//                      list screens like "Tonight" where Silver/Bronze
//                      are still worth showing.
//   goldOnly        -- rankedAvailable further cut to stage 7 (Gold only).
//                      This is "the one great recommendation."
//   trace           -- survivor count after every stage, in order, so a
//                       caller (or a person debugging) can see exactly
//                       where the pool thinned out.
function runFunnel(items, profile, options = {}) {
  const trace = [];
  let pool = availableContent(items);
  trace.push({ stage: 'availableContent', survivors: pool.length });

  pool = editorialQualityFilter(pool);
  trace.push({ stage: 'editorialQualityFilter', survivors: pool.length });

  pool = timelinessFilter(pool, options.now);
  trace.push({ stage: 'timelinessFilter', survivors: pool.length });

  pool = userProfileMatch(pool, profile);
  trace.push({ stage: 'userProfileMatch', survivors: pool.length });

  pool = franchiseCastGenreConnection(pool, profile);
  trace.push({ stage: 'franchiseCastGenreConnection', survivors: pool.length });

  pool = platformAvailabilityFilter(pool, profile);
  trace.push({ stage: 'platformAvailability', survivors: pool.length });

  const rankedAvailable = pool;

  pool = mmSelectRatingFilter(pool);
  trace.push({ stage: 'mmSelectRating', survivors: pool.length });

  return { rankedAvailable, goldOnly: pool, trace };
}

// Ranked list for screens that want more than one pick (e.g. "Tonight").
// Runs stages 1-6 -- editorial, timely, profile-relevant, available --
// and returns the top `limit`. Not restricted to Gold; Silver and Bronze
// items that survive every other stage are legitimate list entries.
function recommendations(items, profile, limit = 6) {
  if (!profile) return [];
  return runFunnel(items, profile).rankedAvailable.slice(0, limit);
}

// The funnel's true output: one great (Gold) recommendation, or null if
// nothing survives every stage. Never fabricates a pick.
function mmChoice(items, profile) {
  if (!profile) return null;
  return runFunnel(items, profile).goldOnly[0] ?? null;
}

// Exposes the stage-by-stage trace directly -- for the Test Lab and for
// debugging "why is this empty" without re-deriving it by hand.
function traceFunnel(items, profile, options = {}) {
  return runFunnel(items, profile, options).trace;
}

function bySelect(items, level) {
  return items.filter(i => i.mmSelect === level);
}

return { runFunnel, recommendations, mmChoice, traceFunnel, bySelect };
})();
const { runFunnel, recommendations, mmChoice, traceFunnel, bySelect } = M_services_mmSelectEngine_js;

const M_router_routes_js = (function() {






// v1.0.0-rc.2: Watchlist and Settings graduated out of placeholder status.

// Shared by Landing's Silver rail, Watchlist, Recommendations, Premieres,
// Movies, and My Reviews so a show/movie renders identically (and with the
// same watchlist/rating/detail actions) wherever it appears -- one card
// shape, not a competing one per screen.
function mediaCard(item, ctx) {
  const inWatchlist = ctx.watchlist.includes(item.id);
  const currentRating = (ctx.ratings && ctx.ratings[item.id]) || 0;
  return Card(item.title, `
    ${Badge(item.mmSelect)}
    <p>${item.platform}</p>
    ${item.why ? `<p class='editorial-note'>${item.why}</p>` : ''}
    ${Rating(item.id, currentRating)}
    <div class='card-actions'>
      <button type='button' class='btn' data-watchlist-toggle='${item.id}'>${inWatchlist ? 'Remove from Watchlist' : 'Add to Watchlist'}</button>
      <button type='button' class='btn' data-detail='${item.id}'>View details</button>
    </div>
  `);
}

function watchlistPage(ctx) {
  const pool = [...ctx.shows, ...ctx.movies];
  const items = ctx.watchlist.map(id => pool.find(i => i.id === id)).filter(Boolean);
  if (!items.length) {
    return Card('Watchlist', `<p>Your watchlist is empty. Add titles from Landing to see them here.</p><button type='button' class='btn' data-page-link='landing'>Back to Landing</button>`);
  }
  return `<div class='stack'>${items.map(item => mediaCard(item, ctx)).join('')}</div>`;
}

function settingsPage(ctx) {
  if (!ctx.profile) return Card('Settings', '<p>Loading your profile&hellip;</p>');
  const genres = ctx.profile.preferredGenres.map(g => PlatformChip(g)).join('');
  const platforms = ctx.profile.preferredPlatforms.map(p => PlatformChip(p)).join('');
  return Card('Settings', `
    <h4>Preferred genres</h4>
    <p>${genres}</p>
    <h4>Preferred platforms</h4>
    <p>${platforms}</p>
    <p class='editorial-note'>Personalization studio -- editing these will be wired up post-beta; this view reflects the live profile model.</p>
  `);
}

// Real output of the recommendation funnel (services/mmSelectEngine.js),
// not placeholder copy. If nothing clears every stage for this profile,
// says so honestly instead of showing an empty screen with no explanation.
function recommendationsPage(ctx) {
  if (!ctx.profile) return Card('Recommendations', '<p>Loading your profile&hellip;</p>');
  const pool = [...ctx.shows, ...ctx.movies];
  const picks = recommendations(pool, ctx.profile, 6);
  if (!picks.length) {
    return Card('Recommendations', '<p>Nothing in the current catalog clears every stage for your profile right now &mdash; check back as new titles are added.</p>');
  }
  return `<div class='stack'>${picks.map(item => mediaCard(item, ctx)).join('')}</div>`;
}

// Tonight: ONE single best bet, not a list -- distinct from Recommendations
// (top 6) rather than a duplicate of it. Same funnel, smaller ask.
function tonightPage(ctx) {
  if (!ctx.profile) return Card('Tonight', '<p>Loading your profile&hellip;</p>');
  const pool = [...ctx.shows, ...ctx.movies];
  const pick = recommendations(pool, ctx.profile, 1)[0];
  if (!pick) {
    return Card('Tonight', '<p>Nothing clears every stage for tonight right now &mdash; check Recommendations for the fuller list.</p>');
  }
  return `${Card('Tonight', "<p>Your single best bet for tonight, picked from what's available and what you like.</p>")}${mediaCard(pick, ctx)}`;
}

// Calendar: a real chronological schedule, built from whichever items
// actually carry a premiere date. Not profile-scored -- this is a schedule,
// not a recommendation list.
function calendarPage(ctx) {
  const pool = [...ctx.shows, ...ctx.movies].filter(i => i.premiere);
  if (!pool.length) {
    return Card('Calendar', '<p>No upcoming premiere dates in the current catalog.</p>');
  }
  const sorted = [...pool].sort((a, b) => new Date(a.premiere) - new Date(b.premiere));
  const rows = sorted.map(item => {
    const date = new Date(item.premiere);
    const dateLabel = isNaN(date.getTime()) ? item.premiere : date.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
    return Card(item.title, `<p>${dateLabel} &middot; ${item.platform}</p>${item.why ? `<p class='editorial-note'>${item.why}</p>` : ''}`);
  });
  return `<div class='stack'>${rows.join('')}</div>`;
}

// Premieres: what's new or actively returning right now, by the data
// model's own `status` field -- distinct from Calendar's date-ordered
// schedule.
function premieresPage(ctx) {
  const pool = [...ctx.shows, ...ctx.movies].filter(i => i.status === 'new' || i.status === 'returning');
  if (!pool.length) {
    return Card('Premieres', '<p>Nothing in the current catalog is marked as a new or returning release.</p>');
  }
  return `<div class='stack'>${pool.map(item => mediaCard(item, ctx)).join('')}</div>`;
}

// Movies: the movie catalog, full stop -- not filtered by profile, since
// this is meant to be browsed, not curated (Recommendations already
// handles curation).
function moviesPage(ctx) {
  if (!ctx.movies.length) {
    return Card('Movies', '<p>No movies in the catalog right now.</p>');
  }
  return `<div class='stack'>${ctx.movies.map(item => mediaCard(item, ctx)).join('')}</div>`;
}

// Franchises: real franchises.json data cross-referenced against the
// catalog, so each universe shows what's actually available in it right
// now, not just static copy.
function franchisesPage(ctx) {
  if (!ctx.franchises || !ctx.franchises.length) {
    return Card('Franchises', '<p>Loading franchise data&hellip;</p>');
  }
  const pool = [...ctx.shows, ...ctx.movies];
  const cards = ctx.franchises.map(f => {
    const items = pool.filter(i => (i.franchises || []).includes(f.title));
    const itemsHtml = items.length
      ? items.map(i => `<p>&bull; ${i.title} &middot; ${i.platform}</p>`).join('')
      : `<p class='editorial-note'>Nothing from this universe in the catalog yet.</p>`;
    return Card(f.title, `<p>Next: ${f.next}</p>${itemsHtml}`);
  });
  return `<div class='stack'>${cards.join('')}</div>`;
}

// My Reviews: genuinely empty until the user has rated something -- no
// fake seed reviews. Lists whatever the ratings state (state/store.js

function reviewsPage(ctx) {
  const pool = [...ctx.shows, ...ctx.movies];
  const ratedIds = Object.keys(ctx.ratings || {});
  if (!ratedIds.length) {
    return Card('My Reviews', "<p>You haven't rated anything yet. Rate a title from Landing, Recommendations, Watchlist, or Movies to start your journal.</p>");
  }
  const items = ratedIds.map(id => pool.find(i => i.id === id)).filter(Boolean);
  return `<div class='stack'>${items.map(item => mediaCard(item, ctx)).join('')}</div>`;
}

// Search: the input + results container are rendered here; the actual
// live-search behavior is wired by bindSearchPage (called from app.js),
// deliberately outside the normal setState()/paint() cycle -- see the
// comment in app.js for why.
function searchPage() {
  return Card('Search', `
    <input type='search' id='mm-search-input' placeholder='Search titles, cast, franchises, genres&hellip;'>
    <div id='mm-search-results'></div>
  `);
}

function bindSearchPage(view, ctx) {
  const input = view.querySelector('#mm-search-input');
  const results = view.querySelector('#mm-search-results');
  if (!input || !results) return;

  function runSearch() {
    const raw = input.value.trim();
    const q = raw.toLowerCase();
    if (!q) {
      results.innerHTML = `<p class='editorial-note'>Type to search titles, cast, franchises, and genres.</p>`;
      return;
    }
    const pool = [...ctx.shows, ...ctx.movies];
    const matches = pool.filter(item => {
      const genres = Array.isArray(item.genre) ? item.genre : (item.genre ? [item.genre] : []);
      const haystack = [item.title, ...(item.cast || []), ...(item.franchises || []), ...genres]
        .filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(q);
    });
    if (!matches.length) {
      results.innerHTML = `<p class='editorial-note'>No matches for &ldquo;${raw}&rdquo;.</p>`;
      return;
    }
    // Search results use a lighter card (no watchlist/rating actions) --
    // this is a lookup, not a curated list, and ctx here intentionally
    // doesn't carry watchlist/ratings state.
    results.innerHTML = matches.map(item => Card(item.title,
      `${Badge(item.mmSelect)}<p>${item.platform}</p>${item.why ? `<p class='editorial-note'>${item.why}</p>` : ''}`
    )).join('');
  }

  if (!input.dataset.bound) {
    input.dataset.bound = 'true';
    input.addEventListener('input', runSearch);
  }
  runSearch();
}

function renderPage(page, ctx) {
  const { landingModel, watchlist, ratings } = ctx;
  if (page === 'landing') {
    const heroInWatchlist = landingModel.hero ? watchlist.includes(landingModel.hero.id) : false;
    const heroRating = landingModel.hero ? ((ratings && ratings[landingModel.hero.id]) || 0) : 0;
    return `<div class='grid'><section>${Hero(landingModel.hero, heroInWatchlist, heroRating)}${Card("Tonight's Watchlist")}</section>

  }
  if (page === 'watchlist') return watchlistPage(ctx);
  if (page === 'settings') return settingsPage(ctx);
  if (page === 'recommendations') return recommendationsPage(ctx);
  if (page === 'tonight') return tonightPage(ctx);
  if (page === 'calendar') return calendarPage(ctx);
  if (page === 'premieres') return premieresPage(ctx);
  if (page === 'movies') return moviesPage(ctx);
  if (page === 'franchises') return franchisesPage(ctx);
  if (page === 'reviews') return reviewsPage(ctx);
  if (page === 'search') return searchPage(ctx);
  return Card('404', '<p>Page not found.</p>');
}

return { bindSearchPage, renderPage };
})();

// ---- boot (adapted from src/app.js for a data-inlined, server-less bundle) ----
function paint() {
  const state = getState();
  const { page, landingModel, shows, movies, profile, franchises, watchlist, ratings } = state;
  setActiveNav(page);
  document.getElementById('view').innerHTML = renderPage(page, { landingModel, shows, movies, profile, franchises, watchlist, ratings });
  location.hash = page;
  bindPageInteractions();
}

function bindPageInteractions() {
  const view = document.getElementById('view');
  if (!view) return;
  view.querySelectorAll('[data-watchlist-toggle]').forEach(el => {
    el.onclick = () => toggleWatchlist(el.dataset.watchlistToggle);
  });
  view.querySelectorAll('[data-detail]').forEach(el => {
    el.onclick = () => {
      const { shows, movies } = getState();
      const item = [...shows, ...movies].find(i => i.id === el.dataset.detail);
      if (item) openModal(item);
    };
  });
  view.querySelectorAll('[data-page-link]').forEach(el => {
    el.onclick = () => navigate(el.dataset.pageLink);
  });
  view.querySelectorAll('[data-rate-id]').forEach(el => {
    el.onclick = () => rateItem(el.dataset.rateId, Number(el.dataset.rating));
  });
  if (getState().page === 'search') {
    const { shows, movies } = getState();
    bindSearchPage(view, { shows, movies });
  }
}

function navigate(page) {
  setState({ page });
}

function init() {
  document.getElementById('header-slot').innerHTML = Header();
  document.getElementById('nav-slot').innerHTML = Navigation();
  document.getElementById('footer-slot').innerHTML = Footer(BUILD.version);

  subscribe(paint);

  const shows = SHOWS_RAW.map(createShow);
  const movies = MOVIES_RAW.map(createMovie);
  const profile = createProfile(PROFILE_RAW);
  const franchises = FRANCHISES_RAW;
  setState({ shows, movies, profile, franchises, landingModel: composeLanding(shows, movies, profile) });

  bindNavigation(navigate);
  setState({ page: location.hash.replace('#', '') || 'landing' });
  window.addEventListener('hashchange', () => setState({ page: location.hash.replace('#', '') || 'landing' }));
}

init();
